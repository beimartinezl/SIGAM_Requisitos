<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}SIGAM{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head><body><header class="topbar"><a class="brand" href="{{ url_for('login') }}"><span class="brand-mark">S</span><span>SIGAM<small>Gestión de activos y mantenimiento</small></span></a><span class="local-tag">ACCESO SEGURO</span></header><main class="auth-content">{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}<section class="auth-card">{% block content %}{% endblock %}</section></main></body></html>
